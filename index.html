<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1427" />
    <title>Plakoto — The Art of the Pin</title>
  </head>
  <body class="on-title auth-pending">
    <div id="ambient"></div>
    <main id="scene" aria-label="Plakoto 3D board" data-i18n-aria="meta.aria-board"></main>
    <div id="board-frame" aria-hidden="true"></div>
    <aside class="sidebar">
      <header class="logo">
        <img src="/plakoto-logo.png" alt="Plakoto" />
      </header>
      <div class="players" aria-label="Players">
        <section class="player red">
          <div class="portrait" id="portrait1"></div>
          <span class="player-number">01</span>
          <h2>PLAYER 1</h2>
          <p><i></i> CRIMSON</p>
        </section>
        <div class="versus"><span></span>VS<span></span></div>
        <section class="player ivory">
          <div class="portrait" id="portrait2"></div>
          <span class="player-number">02</span>
          <h2>PLAYER 2</h2>
          <p><i></i> IVORY</p>
        </section>
      </div>
    </aside>
    <section id="start-screen" aria-label="Plakoto start menu">
      <div class="start-menu">
        <fieldset id="ruleset-picker" class="ruleset-picker">
          <legend>Ruleset</legend>
          <label>
            <input type="radio" name="ruleset" value="CLASSIC" checked />
            <span><strong>Classic</strong><small>Pure Plakoto</small></span>
          </label>
          <label>
            <input type="radio" name="ruleset" value="POWERUPS_V1" />
            <span><strong>Powerups</strong><small>Draft every 3 rounds</small></span>
          </label>
        </fieldset>
        <button id="start-multiplayer" class="mode-button online-mode" disabled>
          <span class="mode-star" aria-hidden="true">✦</span
          ><span id="multiplayer-label" data-i18n="menu.multiplayer">Multiplayer</span
          ><span class="mode-star" aria-hidden="true">✦</span></button
        ><button id="start-local" class="mode-button local-mode" disabled>
          <span class="mode-star" aria-hidden="true">✦</span
          ><span data-i18n="menu.local">Local Game</span
          ><span class="mode-star" aria-hidden="true">✦</span>
        </button>
        <button id="start-room" class="mode-button local-mode" disabled>
          <span class="mode-star" aria-hidden="true">✦</span
          ><span data-i18n="menu.privateRoom">Private room</span
          ><span class="mode-star" aria-hidden="true">✦</span>
        </button>
        <div id="room-panel" class="room-panel" hidden>
          <button type="button" id="room-create" data-i18n="room.create">Create room</button>
          <label
            ><span data-i18n="room.codeLabel">Code</span>
            <input id="room-code" maxlength="8" autocomplete="off" spellcheck="false"
          /></label>
          <button type="button" id="room-join" data-i18n="room.join">Join</button>
          <p id="room-status" role="status" hidden></p>
          <button type="button" id="room-cancel" data-i18n="room.cancel" hidden>Cancel room</button>
        </div>
        <div class="start-options">
          <button data-open="help">
            <svg
              class="rules-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 5v15M3 4c3-1 6-1 9 1 3-2 6-2 9-1v15c-3-1-6-1-9 1-3-2-6-2-9-1V4Z" />
              <path d="M6 8h3M6 11h3M15 8h3M15 11h3" />
            </svg>
            Rules</button
          ><button data-open="settings">
            <svg
              class="settings-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9.5 2.5h5l.6 2.3 2 .9 2.2-.7 2.5 4.3-1.6 1.6v2.2l1.6 1.6-2.5 4.3-2.2-.7-2 .9-.6 2.3h-5l-.6-2.3-2-.9-2.2.7-2.5-4.3 1.6-1.6v-2.2L2.2 9.3 4.7 5l2.2.7 2-.9.6-2.3Z"
              />
              <circle cx="12" cy="12" r="3.1" />
            </svg>
            Settings
          </button>
        </div>
        <p id="match-note" class="match-note" hidden></p>
      </div>
    </section>
    <section
      id="waiting-screen"
      aria-label="Multiplayer matchmaking"
      data-i18n-aria="waiting.screenAria"
      hidden
    >
      <div class="waiting-content">
        <div class="waiting-matchup">
          <section
            class="waiting-card waiting-you"
            aria-label="You"
            data-i18n-aria="waiting.youAria"
          >
            <div id="waiting-portrait" class="waiting-portrait"></div>
            <h2 data-i18n="waiting.you">You</h2>
          </section>
          <span class="waiting-versus" aria-hidden="true">VS</span>
          <section
            class="waiting-card waiting-opponent"
            aria-label="Waiting for opponent"
            data-i18n-aria="waiting.opponentAria"
          >
            <svg
              class="opponent-outline"
              viewBox="0 0 160 140"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              aria-hidden="true"
            >
              <circle cx="80" cy="44" r="26" />
              <path d="M29 129v-13c0-25 23-40 51-40s51 15 51 40v13" />
            </svg>
            <h2>
              <span data-i18n="waiting.waiting">Waiting for</span><br /><span
                data-i18n="waiting.opponent"
                >opponent</span
              >
            </h2>
          </section>
        </div>
        <p class="waiting-status" role="status" aria-live="polite">
          <span class="waiting-spinner" aria-hidden="true"></span
          ><span data-i18n="waiting.searching">Searching for an opponent…</span>
        </p>
        <p id="waiting-ruleset" class="waiting-ruleset">Classic matchmaking</p>
        <button id="waiting-cancel" class="mode-button local-mode">
          <span class="mode-star" aria-hidden="true">✦</span
          ><span data-i18n="waiting.cancel">Cancel</span
          ><span class="mode-star" aria-hidden="true">✦</span>
        </button>
      </div>
    </section>
    <nav class="top-actions" aria-label="Game options" data-i18n-aria="menu.gameOptions">
      <button data-open="settings" aria-label="Settings" data-i18n-aria="menu.settings">
        <svg
          class="settings-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M9.5 2.5h5l.6 2.3 2 .9 2.2-.7 2.5 4.3-1.6 1.6v2.2l1.6 1.6-2.5 4.3-2.2-.7-2 .9-.6 2.3h-5l-.6-2.3-2-.9-2.2.7-2.5-4.3 1.6-1.6v-2.2L2.2 9.3 4.7 5l2.2.7 2-.9.6-2.3Z"
          />
          <circle cx="12" cy="12" r="3.1" />
        </svg>
      </button>
    </nav>
    <p id="ruleset-badge" class="ruleset-badge" hidden></p>
    <output id="dice-result" class="dice-announcement" aria-live="polite" aria-atomic="true"
      >— · —</output
    >
    <section class="game-hud">
      <p id="game-message" role="status" aria-live="polite" hidden></p>
      <output
        id="game-clock"
        class="game-clock"
        aria-label="Turn clock"
        data-i18n-aria="hud.clockLabel"
        hidden
        >2:00</output
      >
      <div id="move-choices"></div>
      <button id="forfeit" data-i18n="hud.resign" hidden>Resign</button>
      <button id="next-game" data-i18n="hud.newGame" hidden>New game →</button>
    </section>
    <section
      id="ability-trays"
      class="ability-trays"
      aria-label="Player abilities"
      data-i18n-aria="draft.players.aria"
      hidden
    >
      <section class="ability-tray red" data-player="0" aria-label="Player 1 ability cards">
        <header>
          <i aria-hidden="true"></i><span data-i18n="draft.player.crimson">Player 1 · Crimson</span>
        </header>
        <div class="ability-loadout"></div>
      </section>
      <section class="ability-tray ivory" data-player="1" aria-label="Player 2 ability cards">
        <header>
          <span data-i18n="draft.player.ivory">Player 2 · Ivory</span><i aria-hidden="true"></i>
        </header>
        <div class="ability-loadout"></div>
      </section>
    </section>
    <section id="draft-panel" role="dialog" aria-modal="true" aria-labelledby="draft-status" hidden>
      <div class="draft-window">
        <span class="draft-eyebrow" data-i18n="draft.eyebrow">Round reward</span>
        <div id="draft-contestants" aria-label="Draft order roll" data-i18n-aria="draft.aria"></div>
        <h2 id="draft-status" data-i18n="draft.chooseAbility">Choose an ability</h2>
        <p id="draft-order"></p>
        <div id="draft-cards"></div>
        <div id="draft-replacement" aria-live="polite"></div>
      </div>
    </section>
    <footer>
      <button
        id="undo"
        class="secondary"
        disabled
        aria-label="Undo"
        data-i18n="hud.undo"
        data-i18n-aria="hud.undo"
      >
        ↶ UNDO
      </button>
      <button id="roll" disabled>ROLL <span>↗</span></button>
    </footer>
    <p id="status" role="status" data-i18n="hud.status.loading">Setting the table…</p>
    <section id="auth-screen" aria-label="Sign in" hidden>
      <form id="auth-form">
        <p class="eyebrow">PLAKOTO</p>
        <h2 id="auth-title" data-i18n="auth.title.create">Create account</h2>
        <label id="auth-email-label"
          ><span data-i18n="auth.email">Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254"
        /></label>
        <label id="auth-username-label"
          ><span data-i18n="auth.username">Username</span>
          <input name="username" autocomplete="username" maxlength="20" spellcheck="false"
        /></label>
        <label id="auth-identifier-label" hidden
          ><span data-i18n="auth.identifier">Email or username</span>
          <input name="identifier" autocomplete="username" maxlength="254" spellcheck="false"
        /></label>
        <label
          ><span data-i18n="auth.password">Password</span>
          <input name="password" type="password" minlength="8" autocomplete="new-password" required
        /></label>
        <p id="auth-error" class="account-error" role="alert"></p>
        <div class="account-actions">
          <button type="submit" id="auth-submit" data-i18n="auth.submit.create">
            Create account
          </button>
          <button type="button" id="auth-switch" data-i18n="auth.iHaveAccount">
            I have an account
          </button>
        </div>
      </form>
    </section>
    <dialog id="overlay">
      <div id="overlay-content"></div>
      <button class="close" aria-label="Close overlay" data-i18n-aria="menu.closeOverlay">×</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
