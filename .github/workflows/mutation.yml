name: Mutation testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Core mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect mutation-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base" ]]; then
            base="$BEFORE_SHA"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$HEAD_SHA" -- \
            'src/game/rules/**' \
            'src/game/session/opening-authority.ts' \
            'src/game/variant/**' \
            'tests/game.test.ts' \
            'tests/opening-authority.test.ts' \
            'tests/variant-session.test.ts' \
            'stryker.config.mjs' \
            'package.json' \
            'pnpm-lock.yaml' \
            'pnpm-workspace.yaml' \
            '.github/workflows/mutation.yml'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No mutation-relevant files changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 26
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: pnpm test:mutation
      - name: Publish mutation summary
        if: always() && steps.changes.outputs.run == 'true'
        run: node scripts/write-mutation-summary.mjs
      - name: Upload mutation report on failure
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 7
